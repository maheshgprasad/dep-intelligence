name: Nami Gate check

on:
  workflow_dispatch:
    inputs:
      review_id:
        description: Stored review id
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: Boundary Gate decision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install backend
        run: pip install -e "./server"
      - name: Check the stored review
        run: python scripts/nami-pr-check.py --review-id "${{ inputs.review_id }}"
