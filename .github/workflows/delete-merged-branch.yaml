name: Delete merged PR branch

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  delete-merged-branch:
    name: Delete merged branch
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Delete merged pull request branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh api "repos/${REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "Branch '${BRANCH}' is already deleted or unavailable."
            exit 0
          fi

          gh api --method DELETE \
            "repos/${REPOSITORY}/git/refs/heads/${BRANCH}"

          echo "Deleted merged branch '${BRANCH}'."
