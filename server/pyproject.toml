[project]
name = "dep-intel"
version = "0.1.0"
description = "Nami Trace: cross-repo dependency intelligence for a React dashboard and for Cursor, Claude, and IBM Bob."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "mcp>=1.2,<2",
  "packaging>=24",
  "pydantic>=2",
  "pydriller>=2.9",
  "pyyaml>=6",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-javascript>=0.23,<0.25",
  "uvicorn>=0.32",
  "watchdog>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
dep-intel-api = "dep_intel.api:main"
nami-trace = "dep_intel.api:main"
dep-intel-mcp = "dep_intel.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
